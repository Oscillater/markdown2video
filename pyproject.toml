[project]
name = "markdown2video"
version = "0.1.0"
description = "Manifest-driven Markdown to video pipeline with Manim and Remotion backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "edge-tts>=7.2.3,<8",
    # Keep the render stack on the version used by the existing implementation.
    "manim==0.19.0",
    "manim-voiceover==0.3.7",
    "numpy>=2.1,<3",
    "pillow>=12,<13",
    "pydantic>=2.12.5,<3",
    # manim-voiceover 0.3.7 requires this range; 1.x conflicts with it.
    "python-dotenv>=0.21,<0.22",
    # manim-voiceover imports pkg_resources without declaring setuptools.
    # New setuptools releases remove that legacy API.
    "setuptools>=68,<81",
    "typing-extensions>=4.15,<5",
]

[project.optional-dependencies]
# The code only uses the OpenAI provider; avoid unused provider/MCP dependencies.
llm = ["pydantic-ai-slim[openai]==1.76.0"]
pexels = ["requests>=2.33.1,<3"]
export = ["opentimelineio==0.18.1", "otio-cmx3600-adapter==1.0.0"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
# Run from the checkout: renderers and components need the adjacent Node sources.
# Do not build a wheel or pull node_modules/artifacts into a Python distribution.
package = false
